name: Proposal lifecycle

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, closed, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_run:
    workflows: [App runtime validation]
    types: [completed]
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'PR numbers to reconcile, separated by commas. Blank reconciles all open PRs.'
        required: false
        type: string
      recover_rejected:
        description: 'Revalidate legacy SHA/order rejections for the selected PRs'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  statuses: write

concurrency:
  group: proposal-automation-writer
  queue: max
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted default-branch code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify lifecycle logic
        run: python3 -m unittest discover -s tests -v
      - name: Process command and refresh merge eligibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          RECOVER_REJECTED: ${{ inputs.recover_rejected }}
        run: python3 scripts/proposal_lifecycle.py
