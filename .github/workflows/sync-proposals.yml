name: Sync proposal list

on:
  workflow_run:
    workflows: [Proposal lifecycle, Assign proposal reviewers]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-proposals.yml
      - scripts/sync_proposals.py
      - scripts/review_identity.py
      - scripts/proposal_lifecycle.py
      - tests/test_sync_proposals.py
      - proposals/**
      - README.md
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: proposal-automation-writer
  queue: max
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check synchronization logic
        run: python3 -m unittest discover -s tests -v
      - name: Refresh the proposal list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_proposals.py --publish
